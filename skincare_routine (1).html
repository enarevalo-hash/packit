<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skincare Routine</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f9f7f4; color: #1a1a18; min-height: 100vh; }
  header { padding: 18px 16px 10px; border-bottom: 1px solid #e8e5e0; }
  h1 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .subtitle { font-size: 12px; color: #999; margin-top: 2px; }
  .tabs { display: flex; gap: 6px; padding: 12px 16px 0; }
  .tab { padding: 7px 18px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1.5px solid #ddd; background: transparent; color: #888; transition: all .15s; }
  .tab.active { background: #1a1a18; border-color: #1a1a18; color: #fff; }
  .panel { display: none; padding: 12px 16px 32px; }
  .panel.active { display: block; }

  /* Day cards */
  .day-card { margin-bottom: 10px; background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #ece9e4; }
  .day-header { padding: 10px 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .day-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .day-name { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #555; flex: 1; }
  .day-sub { font-size: 11px; color: #bbb; }
  .chevron { font-size: 11px; color: #ccc; transition: transform .2s; }
  .day-card.open .chevron { transform: rotate(180deg); }
  .day-body { display: none; border-top: 1px solid #f0ede8; }
  .day-card.open .day-body { display: block; }

  /* Toner block */
  .toner-block { padding: 8px 14px; background: #faf9f7; border-bottom: 1px solid #f0ede8; }
  .toner-label { font-size: 10px; font-weight: 600; color: #bbb; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
  .toner-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #666; margin-bottom: 3px; }
  .toner-arrow { color: #ddd; font-size: 10px; }

  /* Steps */
  .steps { padding: 8px 14px; }
  .step { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; border-bottom: 1px solid #f5f2ee; }
  .step:last-child { border-bottom: none; }
  .step.optional { opacity: .65; }
  .step-num { font-size: 11px; font-weight: 600; color: #ccc; min-width: 16px; padding-top: 2px; }
  .step-info { flex: 1; }
  .step-product { font-size: 13px; font-weight: 500; color: #1a1a18; }
  .step-role { font-size: 11px; color: #aaa; margin-top: 1px; }
  .tag { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 20px; margin-left: 5px; vertical-align: middle; font-weight: 500; }
  .tag-c { background: #fef3c7; color: #92400e; }
  .tag-opt { background: #f3f4f6; color: #9ca3af; }
  .tag-ghk { background: #ede9fe; color: #5b21b6; }
  .tag-egf { background: #fce7f3; color: #9d174d; }
  .tag-pdrn { background: #d1fae5; color: #065f46; }

  /* Legend */
  .legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px 4px; }
  .legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #999; }

  /* Loading */
  .loading { text-align: center; padding: 40px 16px; color: #bbb; font-size: 13px; }
  .error-msg { margin: 16px; padding: 12px; background: #fff0f0; border-radius: 8px; font-size: 12px; color: #c00; }

  /* Day dot colors */
  .dot-sun { background: #f97316; }
  .dot-ret { background: #8b5cf6; }
  .dot-tue { background: #ec4899; }
  .dot-thu { background: #06b6d4; }
  .dot-sat { background: #10b981; }
  .dot-am-a { background: #f59e0b; }
  .dot-am-b { background: #6366f1; }

  @media (prefers-color-scheme: dark) {
    body { background: #141412; color: #e0dfd8; }
    header { border-color: #2a2a28; }
    .tab { border-color: #333; color: #777; }
    .tab.active { background: #e0dfd8; border-color: #e0dfd8; color: #141412; }
    .day-card { background: #1e1e1c; border-color: #2a2a28; }
    .day-body { border-color: #2a2a28; }
    .toner-block { background: #181816; border-color: #2a2a28; }
    .step { border-color: #252523; }
    .step-product { color: #e0dfd8; }
    .tag-c { background: #3d2e0a; color: #fbbf24; }
    .tag-opt { background: #252523; color: #666; }
    .tag-ghk { background: #2e1f5e; color: #c4b5fd; }
    .tag-egf { background: #4a0e2a; color: #f9a8d4; }
    .tag-pdrn { background: #064e3b; color: #6ee7b7; }
  }
</style>
</head>
<body>

<header>
  <h1>Skincare Routine</h1>
  <div class="subtitle" id="last-updated">Loading from Google Sheets…</div>
</header>

<div class="tabs">
  <button class="tab active" onclick="show('am',event)">☀️ Morning</button>
  <button class="tab" onclick="show('pm',event)">🌙 Evening</button>
</div>

<div class="legend">
  <div class="legend-item"><span class="tag tag-ghk">GHK-Cu</span> copper peptide serum</div>
  <div class="legend-item"><span class="tag tag-egf">EGF</span> growth factor</div>
  <div class="legend-item"><span class="tag tag-pdrn">PDRN</span> cream nights</div>
  <div class="legend-item"><span class="tag tag-opt">optional</span></div>
</div>

<div class="panel active" id="am">
  <div id="am-content"><div class="loading">Loading…</div></div>
</div>

<div class="panel" id="pm">
  <div id="pm-content"><div class="loading">Loading…</div></div>
</div>

<script>
// ── CONFIGURATION ──────────────────────────────────────────────
// Replace this with your published Google Sheet CSV URL
// Instructions below on how to get this URL
const SHEET_URL = 'PASTE_YOUR_SHEET_CSV_URL_HERE';https://docs.google.com/spreadsheets/d/e/2PACX-1vQnKJp4tSZ-Yb_UWkGMLmLBDcF439w6Y7blS5PSgqGqta1f8jAHNvjn1pf3NRAwYIvwdeP5OEwupxUA/pub?output=csv
// ──────────────────────────────────────────────────────────────

const FALLBACK = {
  am: [
    { id:'am-a', label:'Day A — Mon / Wed / Fri / Sun', sub:'Vitamin C morning', dot:'dot-am-a', toners:['Etude Soon Jung 5.5','Peach & Lily Wild Dew Essence','Isntree Green Tea Ceramide Milk'], steps:[
      { num:1, product:'Biossance Brightening Eye Serum', role:'Eye area', tags:[] },
      { num:2, product:'Educated Mess Golden Hour', role:'Moisturize · antioxidant', tags:['c'] },
      { num:3, product:'BOJ Aquafresh SPF', role:'Protect — always last', tags:['opt'], note:'→ swap Tatch Milky' },
    ]},
    { id:'am-b', label:'Day B — Tue / Thu / Sat', sub:'Copper peptide morning', dot:'dot-am-b', toners:['Etude Soon Jung 5.5','Peach & Lily Wild Dew Essence','Isntree Green Tea Ceramide Milk'], steps:[
      { num:1, product:'Biossance Brightening Eye Serum', role:'Eye area', tags:[] },
      { num:2, product:'Dr. Reju-All GHK-Cu / PDRN Serum', role:'Firm · repair · copper peptides', tags:['ghk'] },
      { num:3, product:'BOJ Aquafresh SPF', role:'Protect — always last', tags:['opt'], note:'→ swap Tatch Milky' },
    ]},
  ],
  pm: [
    { id:'sun', label:'Sunday', sub:'Peel night', dot:'dot-sun', toners:['Isntree HA Toner Blue','Etude Soon Jung 5.5','I\'m From Mugwort (light)'], steps:[
      { num:1, product:'Dr. Dennis Gross Peel Pads', role:'AHA/BHA treat', tags:[] },
      { num:2, product:'Torriden Dive-In / Aestura Hydro Essence', role:'Hydrate — one or both', tags:[] },
      { num:3, product:'Dear Klairs EGF', role:'Cell renewal · repair signal', tags:['egf'] },
      { num:4, product:'Biossance Marine Algae Eye Cream', role:'Eye area', tags:[] },
      { num:5, product:'Rejuall PDRN Cream', role:'Moisturize · barrier repair', tags:['pdrn'] },
      { num:6, product:'Skinfix Barrier+ Peptide Cream', role:'Seal', tags:[] },
      { num:7, product:'Sunday Riley Juno Oil', role:'Lock in · nourish', tags:['opt'], optional:true },
    ]},
    { id:'ret', label:'Mon / Wed / Fri', sub:'Retinal nights — keep it lean', dot:'dot-ret', toners:['Isntree HA Toner Blue','Etude Soon Jung 5.5','I\'m From Mugwort'], steps:[
      { num:1, product:'Geek & Gorgeous Retinal', role:'Treat — clean dry skin', tags:[] },
      { num:2, product:'Torriden Dive-In / Aestura Hydro Essence', role:'Hydrate — one, not both', tags:[] },
      { num:3, product:'Biossance Marine Algae Eye Cream', role:'Eye area', tags:[] },
      { num:4, product:'Skinfix Barrier+ Peptide Cream', role:'Seal', tags:[] },
      { num:5, product:'Sunday Riley Juno Oil', role:'Lock in · nourish', tags:['opt'], optional:true },
    ]},
    { id:'tue', label:'Tuesday', sub:'Good Genes night', dot:'dot-tue', toners:['Isntree HA Toner Blue','Etude Soon Jung 5.5','I\'m From Mugwort (light)'], steps:[
      { num:1, product:'Sunday Riley Good Genes', role:'AHA · lactic acid', tags:[] },
      { num:2, product:'Torriden Dive-In / Aestura Hydro Essence', role:'Hydrate — one or both', tags:[] },
      { num:3, product:'Dear Klairs EGF', role:'Cell renewal · repair signal', tags:['egf'] },
      { num:4, product:'Biossance Marine Algae Eye Cream', role:'Eye area', tags:[] },
      { num:5, product:'Rejuall Rejuvenating Cream Max', role:'Moisturize · barrier repair', tags:['pdrn'] },
      { num:6, product:'Skinfix Barrier+ Peptide Cream', role:'Seal', tags:[] },
    ]},
    { id:'thu', label:'Thursday', sub:'Microfoliant night', dot:'dot-thu', toners:['Isntree HA Toner Blue','Etude Soon Jung 5.5','I\'m From Mugwort (light)'], steps:[
      { num:1, product:'Dermalogica Daily Microfoliant', role:'Polish', tags:[] },
      { num:2, product:'Torriden Dive-In / Aestura Hydro Essence', role:'Hydrate — one or both', tags:[] },
      { num:3, product:'Dear Klairs EGF', role:'Cell renewal · repair signal', tags:['egf'] },
      { num:4, product:'Biossance Marine Algae Eye Cream', role:'Eye area', tags:[] },
      { num:5, product:'Rejuall PDRN Cream', role:'Moisturize · barrier repair', tags:['pdrn'] },
      { num:6, product:'Skinfix Barrier+ Peptide Cream', role:'Seal — optional', tags:['opt'], optional:true },
    ]},
    { id:'sat', label:'Saturday', sub:'Recovery night', dot:'dot-sat', toners:['Isntree HA Toner Blue','Etude Soon Jung 5.5','I\'m From Mugwort'], steps:[
      { num:1, product:'Torriden Dive-In / Aestura Hydro Essence', role:'Hydrate — one or both', tags:[] },
      { num:2, product:'Dear Klairs EGF', role:'Cell renewal · repair signal', tags:['egf'] },
      { num:3, product:'Biossance Marine Algae Eye Cream', role:'Eye area', tags:[] },
      { num:4, product:'Rejuall Rejuvenating Cream Max', role:'Moisturize · barrier repair', tags:['pdrn'] },
      { num:5, product:'Skinfix Barrier+ Peptide Cream', role:'Seal', tags:[] },
      { num:6, product:'Sunday Riley Juno Oil', role:'Lock in · nourish', tags:['opt'], optional:true },
    ]},
  ]
};

function tagHTML(tags, note) {
  let h = '';
  if (tags.includes('c')) h += '<span class="tag tag-c">Vitamin C</span>';
  if (tags.includes('ghk')) h += '<span class="tag tag-ghk">GHK-Cu</span>';
  if (tags.includes('egf')) h += '<span class="tag tag-egf">EGF</span>';
  if (tags.includes('pdrn')) h += '<span class="tag tag-pdrn">PDRN</span>';
  if (tags.includes('opt')) h += '<span class="tag tag-opt">optional</span>';
  if (note) h += ' <span style="font-size:10px;color:#bbb">'+note+'</span>';
  return h;
}

function renderDays(days, containerId) {
  const container = document.getElementById(containerId);
  container.innerHTML = days.map((day, i) => `
    <div class="day-card ${i===0?'open':''}" id="card-${day.id}">
      <div class="day-header" onclick="toggle('card-${day.id}')">
        <div class="day-dot ${day.dot}"></div>
        <div class="day-name">${day.label}</div>
        <div class="day-sub">${day.sub}</div>
        <div class="chevron">▼</div>
      </div>
      <div class="day-body">
        <div class="toner-block">
          <div class="toner-label">Toners</div>
          ${day.toners.map((t,idx) => `
            <div class="toner-row">
              ${idx>0?'<span class="toner-arrow">→</span>':'<span style="width:14px;display:inline-block"></span>'}
              <span>${t}</span>
            </div>`).join('')}
        </div>
        <div class="steps">
          ${day.steps.map(s => `
            <div class="step ${s.optional?'optional':''}">
              <div class="step-num">${s.num}</div>
              <div class="step-info">
                <div class="step-product">${s.product}${tagHTML(s.tags, s.note)}</div>
                <div class="step-role">${s.role}</div>
              </div>
            </div>`).join('')}
        </div>
      </div>
    </div>`).join('');
}

function toggle(id) {
  document.getElementById(id).classList.toggle('open');
}

function show(id, e) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  e.target.classList.add('active');
}

// Parse CSV from Google Sheets
// Sheet columns: Panel, DayID, DayLabel, DaySub, DotClass, TonerOrder, StepNum, Product, Role, Tags, Optional, Note
function parseCSV(text) {
  const lines = text.trim().split('\n').slice(1); // skip header
  const amMap = {}, pmMap = {};

  lines.forEach(line => {
    const cols = line.split(',').map(c => c.replace(/^"|"$/g,'').trim());
    const [panel, dayId, dayLabel, daySub, dotClass, tonerOrder, stepNum, product, role, tags, optional, note] = cols;
    if (!panel || !product) return;

    const map = panel.toLowerCase() === 'am' ? amMap : pmMap;
    if (!map[dayId]) map[dayId] = { id:dayId, label:dayLabel, sub:daySub, dot:dotClass, toners:[], steps:[] };

    if (tonerOrder && !isNaN(parseInt(tonerOrder))) {
      map[dayId].toners[parseInt(tonerOrder)-1] = product;
    } else if (stepNum && !isNaN(parseInt(stepNum))) {
      map[dayId].steps.push({
        num: parseInt(stepNum),
        product,
        role: role || '',
        tags: tags ? tags.split('|').map(t=>t.trim()) : [],
        optional: optional === 'TRUE' || optional === 'true' || optional === '1',
        note: note || ''
      });
    }
  });

  return {
    am: Object.values(amMap),
    pm: Object.values(pmMap)
  };
}

async function loadFromSheet() {
  if (SHEET_URL === 'PASTE_YOUR_SHEET_CSV_URL_HERE') {
    // Use fallback data
    document.getElementById('last-updated').textContent = 'Edit products in Google Sheets to update this page';
    renderDays(FALLBACK.am, 'am-content');
    renderDays(FALLBACK.pm, 'pm-content');
    return;
  }

  try {
    const res = await fetch(SHEET_URL);
    if (!res.ok) throw new Error('Sheet not found');
    const text = await res.text();
    const data = parseCSV(text);
    document.getElementById('last-updated').textContent = 'Updated from Google Sheets · ' + new Date().toLocaleDateString();
    renderDays(data.am.length ? data.am : FALLBACK.am, 'am-content');
    renderDays(data.pm.length ? data.pm : FALLBACK.pm, 'pm-content');
  } catch(e) {
    document.getElementById('last-updated').textContent = 'Showing saved routine';
    renderDays(FALLBACK.am, 'am-content');
    renderDays(FALLBACK.pm, 'pm-content');
  }
}

loadFromSheet();
</script>
</body>
</html>
