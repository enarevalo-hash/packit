<script>
const SHEET_ID = '1htzfqWUDPsq9fufZKZtinn9fAjc-2SNLLG0jLlKnI0Q';
const PM_TAB = 'PM';
const AM_TAB = 'AM';
const WAIT_TIMES = {
  'peel pad': { label: 'Wait 2 min', seconds: 120 },
  'good gene': { label: 'Wait 3-5 min', seconds: 180, btnLabel: 'Start (3 min)' },
  'retinal': { label: 'Wait 20 sec', seconds: 20 },
  'peptide booster': { label: 'Wait 30 sec', seconds: 30 },
  'cosrx': { label: 'Wait 30 sec', seconds: 30 },
  'egf': { label: 'Wait 60 sec', seconds: 60 },
  'klairs': { label: 'Wait 60 sec', seconds: 60 },
};
const DAY_CONFIG = {
  'sunday':   { label: 'Sunday',          sub: 'Peel night',              dot: 'dot-sun', open: true },
  'retinal':  { label: 'Mon / Wed / Fri', sub: 'Retinal — keep it lean',  dot: 'dot-ret', open: false },
  'tuesday':  { label: 'Tuesday',         sub: 'Good Genes night',        dot: 'dot-tue', open: false },
  'thursday': { label: 'Thursday',        sub: 'Microfoliant night',      dot: 'dot-thu', open: false },
  'saturday': { label: 'Saturday',        sub: 'Recovery night',          dot: 'dot-sat', open: false },
  'am-a':     { label: 'Day A — Mon / Wed / Fri / Sun', sub: 'Vitamin C',      dot: 'dot-am-a', open: true },
  'am-b':     { label: 'Day B — Tue / Thu / Sat',       sub: 'Copper peptide', dot: 'dot-am-b', open: false },
};
function getTags(product) {
  const p = product.toLowerCase();
  const tags = [];
  if (p.includes('golden hour') || p.includes('vitamin c')) tags.push('c');
  if (p.includes('ghk') || p.includes('copper')) tags.push('ghk');
  if (p.includes('egf') || p.includes('klairs')) tags.push('egf');
  if ((p.includes('pdrn') || p.includes('rejuvenating')) && (p.includes('cream') || p.includes('max'))) tags.push('pdrn');
  if (p.includes('spf') || p.includes('aquafresh') || p.includes('tatch') || p.includes('milky')) tags.push('spf');
  return tags;
}
function tagHTML(tags) {
  return tags.map(t => {
    if (t==='c')    return '<span class="tag tag-c">Vitamin C</span>';
    if (t==='ghk')  return '<span class="tag tag-ghk">GHK-Cu</span>';
    if (t==='egf')  return '<span class="tag tag-egf">EGF</span>';
    if (t==='pdrn') return '<span class="tag tag-pdrn">PDRN</span>';
    if (t==='spf')  return '<span class="tag tag-spf">SPF</span>';
    return '';
  }).join('');
}
function getWaitTime(product) {
  const p = product.toLowerCase();
  for (const [key, val] of Object.entries(WAIT_TIMES)) {
    if (p.includes(key)) return val;
  }
  return null;
}
function waitRowHTML(wait) {
  if (!wait) return '';
  const btnLabel = wait.btnLabel || 'Start';
  return `<div class="wait-row"><span class="wait-label">⏱ ${wait.label}</span><button class="timer-btn" onclick="startTimer(this,${wait.seconds},'${btnLabel}')">▶ ${btnLabel}</button></div>`;
}
function warnHTML(warning) {
  if (!warning) return '';
  const isSkip = warning.toLowerCase().includes('skip') || warning.includes('⚠');
  const cls = isSkip ? 'toner-warn-skip' : 'toner-warn-keep';
  const icon = isSkip ? '⚠' : '✓';
  const text = warning.replace(/^[⚠✓]\s*/,'');
  return `<span class="${cls}">${icon} ${text}</span>`;
}
function buildDayCard(dayKey, config, toners, steps) {
  const id = 'card-'+dayKey;
  const tonerRows = toners.map((t,i) => `<div class="toner-row">${i===0?'<span style="width:14px;display:inline-block"></span>':'<span class="toner-arrow">→</span>'}<span>${t.product}</span>${t.warning?warnHTML(t.warning):''}</div>`).join('');
  const stepRows = steps.map(s => {
    const tags = getTags(s.product);
    const wait = getWaitTime(s.product);
    return `<div class="step${s.optional?' optional':''}"><div class="step-num">${s.step}</div><div class="step-info"><div class="step-product">${s.product}${tagHTML(tags)}</div>${s.notes?`<div class="step-meta">${s.notes}</div>`:''} ${waitRowHTML(wait)}</div></div>`;
  }).join('');
  return `<div class="day-card${config.open?' open':''}" id="${id}"><div class="day-header" onclick="toggle('${id}')"><div class="day-dot ${config.dot}"></div><div class="day-name">${config.label}</div><div class="day-sub">${config.sub}</div><div class="chevron">▼</div></div><div class="day-body">${toners.length?`<div class="toner-block"><div class="toner-label">Toners</div>${tonerRows}</div>`:''}<div class="steps">${stepRows}</div></div></div>`;
}
function parseRows(rows) {
  const tonersByDay={}, stepsByDay={}, dayOrder=[];
  rows.forEach(r => {
    const day=(r['Day']||'').trim().toLowerCase();
    const step=(r['Step']||'').trim().toLowerCase();
    const prod=(r['Product']||'').trim();
    const notes=(r['Notes']||'').trim();
    const opt=(r['Optional']||'').trim().toLowerCase()==='yes';
    const warn=(r['Warning']||'').trim();
    if (!day||!prod) return;
    if (!dayOrder.includes(day)) dayOrder.push(day);
    if (step==='toner') {
      if (!tonersByDay[day]) tonersByDay[day]=[];
      tonersByDay[day].push({product:prod,warning:warn});
    } else {
      if (!stepsByDay[day]) stepsByDay[day]=[];
      stepsByDay[day].push({step:r['Step'],product:prod,notes,optional:opt});
    }
  });
  return {tonersByDay,stepsByDay,dayOrder};
}
function renderPanel(panelId, rows) {
  const {tonersByDay,stepsByDay,dayOrder} = parseRows(rows);
  const panel = document.getElementById(panelId);
  if (!dayOrder.length) { panel.innerHTML='<div class="loading-msg">No data found</div>'; return; }
  panel.innerHTML = dayOrder.map(day => {
    const cfg = DAY_CONFIG[day] || {label:day,sub:'',dot:'dot-sun',open:false};
    return buildDayCard(day, cfg, tonersByDay[day]||[], stepsByDay[day]||[]);
  }).join('');
}
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h=>h.replace(/^"|"$/g,'').trim());
  return lines.slice(1).map(line => {
    const cols=[]; let cur='', inQ=false;
    for (let i=0;i<line.length;i++) {
      const ch=line[i];
      if (ch==='"') { inQ=!inQ; }
      else if (ch===','&&!inQ) { cols.push(cur.trim()); cur=''; }
      else { cur+=ch; }
    }
    cols.push(cur.trim());
    const row={};
    headers.forEach((h,i)=>row[h]=(cols[i]||'').replace(/^"|"$/g,'').trim());
    return row;
  });
}
async function fetchTab(sheetId, tabName) {
  const url=`https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tabName)}`;
  const res=await fetch(url);
  if (!res.ok) throw new Error('fetch failed');
  return res.text();
}
async function loadRoutine() {

    document.getElementById('status').textContent='Add your Sheet ID to activate live updates';
    renderFallback(); return;

  try {
    const [pmCSV,amCSV] = await Promise.all([fetchTab(SHEET_ID,PM_TAB),fetchTab(SHEET_ID,AM_TAB)]);
