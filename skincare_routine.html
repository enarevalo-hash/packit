<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skincare Routine</title>
<link rel="manifest" href="skincare_manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skincare">
<meta name="theme-color" content="#f9f7f4">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f9f7f4; color: #1a1a18; min-height: 100vh; }
  header { padding: 18px 16px 6px; border-bottom: 1px solid #e8e5e0; }
  h1 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .header-meta { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
  .subtitle { font-size: 12px; color: #999; flex: 1; }
  .sync-badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; white-space: nowrap; }
  .sync-badge.stale { background: #fefce8; color: #854d0e; border-color: #fde68a; }
  .tabs { display: flex; gap: 6px; padding: 12px 16px 0; }
  .tab { padding: 7px 18px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1.5px solid #ddd; background: transparent; color: #888; transition: all .15s; }
  .tab.active { background: #1a1a18; border-color: #1a1a18; color: #fff; }
  .panel { display: none; padding: 12px 16px 32px; }
  .panel.active { display: block; }
  .day-card { margin-bottom: 10px; background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #ece9e4; }
  .day-card.today-card { border-color: #8b6fbf; box-shadow: 0 0 0 2px #ede9fe; }
  .day-header { padding: 10px 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .day-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .day-name { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #555; flex: 1; }
  .day-sub { font-size: 11px; color: #bbb; }
  .today-pill { font-size: 10px; background: #8b6fbf; color: #fff; padding: 1px 7px; border-radius: 20px; margin-left: 4px; }
  .chevron { font-size: 11px; color: #ccc; transition: transform .2s; }
  .day-card.open .chevron { transform: rotate(180deg); }
  .day-body { display: none; border-top: 1px solid #f0ede8; }
  .day-card.open .day-body { display: block; }
  .toner-block { padding: 8px 14px; background: #faf9f7; border-bottom: 1px solid #f0ede8; }
  .toner-label { font-size: 10px; font-weight: 600; color: #bbb; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
  .toner-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #666; margin-bottom: 3px; flex-wrap: wrap; }
  .toner-arrow { color: #ddd; font-size: 10px; }
  .toner-warn-skip { font-size: 10px; color: #e8876a; font-weight: 500; margin-left: 4px; }
  .toner-warn-keep { font-size: 10px; color: #10b981; font-weight: 500; margin-left: 4px; }
  .toner-note { font-size: 10px; color: #8b6fbf; font-weight: 500; margin-left: 4px; }
  .steps { padding: 8px 14px; }
  .step { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f5f2ee; }
  .step:last-child { border-bottom: none; }
  .step.optional { opacity: .6; }
  .step-num { font-size: 11px; font-weight: 600; color: #ccc; min-width: 16px; padding-top: 3px; flex-shrink: 0; }
  .step-info { flex: 1; }
  .step-product { font-size: 13px; font-weight: 500; color: #1a1a18; line-height: 1.3; }
  .step-meta { font-size: 11px; color: #aaa; margin-top: 3px; line-height: 1.4; }
  .wait-note { font-size: 11px; color: #8b6fbf; font-weight: 500; margin-top: 4px; }
  .tag { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 20px; margin-left: 5px; vertical-align: middle; font-weight: 500; }
  .tag-c { background: #fef3c7; color: #92400e; }
  .tag-opt { background: #f3f4f6; color: #9ca3af; }
  .tag-ghk { background: #ede9fe; color: #5b21b6; }
  .tag-rej { background: #fce7f3; color: #9d174d; }
  .tag-egf { background: #fce7f3; color: #9d174d; }
  .tag-pdrn { background: #d1fae5; color: #065f46; }
  .tag-spf { background: #fef9c3; color: #854d0e; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px 4px; }
  .legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #999; }
  .dot-sun { background: #f97316; }
  .dot-ret { background: #8b5cf6; }
  .dot-exf { background: #ec4899; }
  .dot-sat { background: #10b981; }
  .dot-am-a { background: #f59e0b; }
  .dot-am-b { background: #6366f1; }
  @media (prefers-color-scheme: dark) {
    body { background: #141412; color: #e0dfd8; }
    header { border-color: #2a2a28; }
    .tab { border-color: #333; color: #777; }
    .tab.active { background: #e0dfd8; border-color: #e0dfd8; color: #141412; }
    .day-card { background: #1e1e1c; border-color: #2a2a28; }
    .day-card.today-card { border-color: #8b6fbf; box-shadow: 0 0 0 2px #2e1f5e; }
    .day-body { border-color: #2a2a28; }
    .toner-block { background: #181816; border-color: #2a2a28; }
    .step { border-color: #252523; }
    .step-product { color: #e0dfd8; }
    .sync-badge { background: #064e3b; color: #6ee7b7; border-color: #065f46; }
    .sync-badge.stale { background: #3d2e0a; color: #fbbf24; border-color: #92400e; }
    .tag-c { background: #3d2e0a; color: #fbbf24; }
    .tag-opt { background: #252523; color: #666; }
    .tag-ghk { background: #2e1f5e; color: #c4b5fd; }
    .tag-rej { background: #4a0e2a; color: #f9a8d4; }
    .tag-egf { background: #4a0e2a; color: #f9a8d4; }
    .tag-pdrn { background: #064e3b; color: #6ee7b7; }
    .tag-spf { background: #3d3000; color: #fde68a; }
  }
</style>
</head>
<body>
<header>
  <h1>Skincare Routine</h1>
  <div class="header-meta">
    <div class="subtitle" id="status">Loading…</div>
    <div class="sync-badge" id="sync-badge" style="display:none"></div>
  </div>
</header>
<div class="tabs">
  <button class="tab" onclick="show('am',event)">☀️ Morning</button>
  <button class="tab active" onclick="show('pm',event)">🌙 Evening</button>
</div>
<div class="legend">
  <div class="legend-item"><span class="tag tag-ghk">GHK-Cu</span> copper peptide</div>
  <div class="legend-item"><span class="tag tag-egf">EGF</span> growth factor</div>
  <div class="legend-item"><span class="tag tag-rej">Rejuran</span> PDRN + EGF</div>
  <div class="legend-item"><span class="tag tag-pdrn">PDRN</span> repair cream</div>
  <div class="legend-item"><span class="tag tag-opt">optional</span></div>
</div>
<div class="panel" id="am"></div>
<div class="panel active" id="pm"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz07Mx11K_5oTfOebl6IKikF5LMGIts99VjlI-wNDnNELj6i_eyOc7au5BpXXqKiQha/exec';
const CACHE_KEY = 'skincare_data_v5';
const CACHE_TIME_KEY = 'skincare_sync_time_v5';

// ---- Build lookups from raw sheet rows ----

function buildModel(data) {
  const products = {};
  (data.products || []).forEach(r => {
    const key = String(r.Day || '').trim().toLowerCase();
    const name = String(r.Product || '').trim();
    if (key && name) products[key] = name;
  });

  const daysByPanel = { am: [], pm: [] };
  (data.days || []).forEach(r => {
    const panel = String(r.panel || '').trim().toLowerCase();
    if (panel !== 'am' && panel !== 'pm') return;
    daysByPanel[panel].push({
      key: String(r.key || '').trim(),
      label: String(r.label || '').trim(),
      sub: String(r.sub || '').trim(),
      dot: String(r.dot || '').trim(),
      tonerNote: String(r.toner_note || '').trim(),
      order: Number(r.order) || 0
    });
  });
  daysByPanel.am.sort((a,b) => a.order - b.order);
  daysByPanel.pm.sort((a,b) => a.order - b.order);

  const tonersByDay = {};
  (data.toners || []).forEach(r => {
    const dayKey = String(r.day_key || '').trim();
    if (!dayKey) return;
    (tonersByDay[dayKey] = tonersByDay[dayKey] || []).push({
      order: Number(r.order) || 0,
      name: String(r.name || '').trim(),
      warn: String(r.warn || '').trim(),
      warnText: String(r.warn_text || '').trim()
    });
  });
  Object.values(tonersByDay).forEach(list => list.sort((a,b) => a.order - b.order));

  const stepsByDay = {};
  (data.steps || []).forEach(r => {
    const dayKey = String(r.day_key || '').trim();
    if (!dayKey) return;
    (stepsByDay[dayKey] = stepsByDay[dayKey] || []).push({
      order: Number(r.order) || 0,
      productKey: String(r.product_key || '').trim().toLowerCase(),
      notes: String(r.notes || '').trim(),
      waitNote: String(r.wait_note || '').trim(),
      optional: String(r.optional || '').trim().toUpperCase() === 'TRUE'
    });
  });
  Object.values(stepsByDay).forEach(list => list.sort((a,b) => a.order - b.order));

  const scheduleByPanel = { am: {}, pm: {} };
  (data.schedule || []).forEach(r => {
    const panel = String(r.panel || '').trim().toLowerCase();
    const weekday = Number(r.weekday);
    const dayKey = String(r.day_key || '').trim();
    if ((panel === 'am' || panel === 'pm') && !isNaN(weekday) && dayKey) {
      scheduleByPanel[panel][weekday] = dayKey;
    }
  });

  return { products, daysByPanel, tonersByDay, stepsByDay, scheduleByPanel };
}

function getTodayCard(scheduleByPanel) {
  const weekday = new Date().getDay();
  return {
    am: scheduleByPanel.am[weekday],
    pm: scheduleByPanel.pm[weekday]
  };
}

function getTags(name) {
  const n = name.toLowerCase();
  const tags = [];
  if (n.includes('golden hour') || n.includes('vitamin c')) tags.push('c');
  if (n.includes('ghk') || n.includes('copper')) tags.push('ghk');
  if (n.includes('egf') && !n.includes('rejuran')) tags.push('egf');
  if (n.includes('rejuran') || n.includes('dual')) tags.push('rej');
  if ((n.includes('pdrn') || n.includes('rejuvenating')) && (n.includes('cream') || n.includes('max'))) tags.push('pdrn');
  if (n.includes('spf') || n.includes('aquafresh') || n.includes('tatch') || n.includes('milky')) tags.push('spf');
  return tags;
}

function tagHTML(name) {
  return getTags(name).map(t => {
    if (t==='c')    return '<span class="tag tag-c">Vitamin C</span>';
    if (t==='ghk')  return '<span class="tag tag-ghk">GHK-Cu</span>';
    if (t==='egf')  return '<span class="tag tag-egf">EGF</span>';
    if (t==='rej')  return '<span class="tag tag-rej">Rejuran</span>';
    if (t==='pdrn') return '<span class="tag tag-pdrn">PDRN</span>';
    if (t==='spf')  return '<span class="tag tag-spf">SPF</span>';
    return '';
  }).join('');
}

function renderRoutine(model) {
  const today = getTodayCard(model.scheduleByPanel);

  ['pm','am'].forEach(panel => {
    const days = model.daysByPanel[panel] || [];
    document.getElementById(panel).innerHTML = days.map(day => {
      const isToday = today[panel] === day.key;
      const todayLabel = isToday ? (panel==='am' ? '<span class="today-pill">Today</span>' : '<span class="today-pill">Tonight</span>') : '';

      const tonerNote = day.tonerNote ? `<span class="toner-note">↑ ${day.tonerNote}</span>` : '';
      const toners = model.tonersByDay[day.key] || [];
      const tonerRows = toners.map((t,i) => {
        const warn = t.warn ? `<span class="toner-warn-${t.warn}">${t.warn==='skip'?'⚠':'✓'} ${t.warnText}</span>` : '';
        return `<div class="toner-row">${i===0?'<span style="width:14px;display:inline-block"></span>':'<span class="toner-arrow">→</span>'}<span>${t.name}</span>${warn}</div>`;
      }).join('');

      const steps = model.stepsByDay[day.key] || [];
      const stepRows = steps.map((s, idx) => {
        const name = model.products[s.productKey] || s.productKey;
        const waitRow = s.waitNote ? `<div class="wait-note">⏱ ${s.waitNote}</div>` : '';
        return `<div class="step${s.optional?' optional':''}">
          <div class="step-num">${idx+1}</div>
          <div class="step-info">
            <div class="step-product">${name}${tagHTML(name)}</div>
            ${s.notes?`<div class="step-meta">${s.notes}</div>`:''}
            ${waitRow}
          </div>
        </div>`;
      }).join('');

      return `<div class="day-card${isToday?' open today-card':''}" id="card-${day.key}">
        <div class="day-header" onclick="toggle('card-${day.key}')">
          <div class="day-dot ${day.dot}"></div>
          <div class="day-name">${day.label}${todayLabel}</div>
          <div class="day-sub">${day.sub}</div>
          <div class="chevron">▼</div>
        </div>
        <div class="day-body">
          <div class="toner-block"><div class="toner-label">Toners ${tonerNote}</div>${tonerRows}</div>
          <div class="steps">${stepRows}</div>
        </div>
      </div>`;
    }).join('');
  });
}

function updateSyncBadge(live) {
  const badge = document.getElementById('sync-badge');
  const timeStr = localStorage.getItem(CACHE_TIME_KEY);
  if (!timeStr) { badge.style.display='none'; return; }
  const mins = Math.round((Date.now() - parseInt(timeStr)) / 60000);
  const label = mins < 1 ? 'Synced just now' : mins < 60 ? `Synced ${mins}m ago` : 'Synced ' + new Date(parseInt(timeStr)).toLocaleDateString();
  badge.textContent = label;
  badge.className = 'sync-badge' + (live ? '' : ' stale');
  badge.style.display = 'block';
}

async function loadRoutine() {
  const cached = localStorage.getItem(CACHE_KEY);
  if (cached) {
    try {
      renderRoutine(buildModel(JSON.parse(cached)));
      document.getElementById('status').textContent='Skincare Routine';
      updateSyncBadge(false);
    } catch(e) {}
  }
  try {
    const res = await fetch(SCRIPT_URL);
    if (!res.ok) throw new Error('failed');
    const data = await res.json();
    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    localStorage.setItem(CACHE_TIME_KEY, Date.now().toString());
    renderRoutine(buildModel(data));
    document.getElementById('status').textContent = 'Skincare Routine';
    updateSyncBadge(true);
  } catch(e) {
    if (!cached) { document.getElementById('status').textContent='Could not load routine'; }
  }
}

function toggle(id) { document.getElementById(id).classList.toggle('open'); }
function show(id, e) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  e.target.classList.add('active');
}

loadRoutine();
</script>
</body>
</html>
