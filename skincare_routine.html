<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skincare Routine</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f9f7f4; color: #1a1a18; min-height: 100vh; }
  header { padding: 18px 16px 10px; border-bottom: 1px solid #e8e5e0; }
  h1 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .subtitle { font-size: 12px; color: #999; margin-top: 2px; }
  .tabs { display: flex; gap: 6px; padding: 12px 16px 0; }
  .tab { padding: 7px 18px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1.5px solid #ddd; background: transparent; color: #888; transition: all .15s; }
  .tab.active { background: #1a1a18; border-color: #1a1a18; color: #fff; }
  .panel { display: none; padding: 12px 16px 32px; }
  .panel.active { display: block; }
  .day-card { margin-bottom: 10px; background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #ece9e4; }
  .day-header { padding: 10px 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .day-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .day-name { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #555; flex: 1; }
  .day-sub { font-size: 11px; color: #bbb; }
  .chevron { font-size: 11px; color: #ccc; transition: transform .2s; }
  .day-card.open .chevron { transform: rotate(180deg); }
  .day-body { display: none; border-top: 1px solid #f0ede8; }
  .day-card.open .day-body { display: block; }
  .toner-block { padding: 8px 14px; background: #faf9f7; border-bottom: 1px solid #f0ede8; }
  .toner-label { font-size: 10px; font-weight: 600; color: #bbb; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
  .toner-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #666; margin-bottom: 3px; }
  .toner-arrow { color: #ddd; font-size: 10px; }
  .steps { padding: 8px 14px; }
  .step { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; border-bottom: 1px solid #f5f2ee; }
  .step:last-child { border-bottom: none; }
  .step.optional { opacity: .6; }
  .step-num { font-size: 11px; font-weight: 600; color: #ccc; min-width: 16px; padding-top: 2px; }
  .step-product { font-size: 13px; font-weight: 500; color: #1a1a18; }
  .step-role { font-size: 11px; color: #aaa; margin-top: 1px; }
  .tag { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 20px; margin-left: 5px; vertical-align: middle; font-weight: 500; }
  .tag-c { background: #fef3c7; color: #92400e; }
  .tag-opt { background: #f3f4f6; color: #9ca3af; }
  .tag-ghk { background: #ede9fe; color: #5b21b6; }
  .tag-egf { background: #fce7f3; color: #9d174d; }
  .tag-pdrn { background: #d1fae5; color: #065f46; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px 4px; }
  .legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #999; }
  .dot-sun { background: #f97316; }
  .dot-ret { background: #8b5cf6; }
  .dot-tue { background: #ec4899; }
  .dot-thu { background: #06b6d4; }
  .dot-sat { background: #10b981; }
  .dot-am-a { background: #f59e0b; }
  .dot-am-b { background: #6366f1; }
  @media (prefers-color-scheme: dark) {
    body { background: #141412; color: #e0dfd8; }
    header { border-color: #2a2a28; }
    .tab { border-color: #333; color: #777; }
    .tab.active { background: #e0dfd8; border-color: #e0dfd8; color: #141412; }
    .day-card { background: #1e1e1c; border-color: #2a2a28; }
    .day-body { border-color: #2a2a28; }
    .toner-block { background: #181816; border-color: #2a2a28; }
    .step { border-color: #252523; }
    .step-product { color: #e0dfd8; }
    .tag-c { background: #3d2e0a; color: #fbbf24; }
    .tag-opt { background: #252523; color: #666; }
    .tag-ghk { background: #2e1f5e; color: #c4b5fd; }
    .tag-egf { background: #4a0e2a; color: #f9a8d4; }
    .tag-pdrn { background: #064e3b; color: #6ee7b7; }
  }
</style>
</head>
<body>
<header>
  <h1>Skincare Routine</h1>
  <div class="subtitle">AM · PM schedule</div>
</header>
<div class="tabs">
  <button class="tab active" onclick="show('am',event)">☀️ Morning</button>
  <button class="tab" onclick="show('pm',event)">🌙 Evening</button>
</div>
<div class="legend">
  <div class="legend-item"><span class="tag tag-ghk">GHK-Cu</span> copper peptide</div>
  <div class="legend-item"><span class="tag tag-egf">EGF</span> growth factor</div>
