  .steps { padding: 8px 14px; }

  .step:last-child { border-bottom: none; }

  .step-num { font-size: 11px; font-weight: 600; color: #ccc; min-width: 16px; padding-top: 3px; flex-shrink: 0; }

<script>

const CACHE_KEY = 'skincare_products_v4';
const CACHE_TIME_KEY = 'skincare_sync_time_v4';
const TIMER_KEY = 'skincare_timers_v4';

  const day = new Date().getDay();
  const pmMap = { 0:'sunday', 1:'retinal', 2:'exfoliant', 3:'retinal', 4:'exfoliant', 5:'retinal', 6:'saturday' };
  const amMap = { 0:'am-a', 1:'am-a', 2:'am-b', 3:'am-a', 4:'am-b', 5:'am-a', 6:'am-b' };
  return { pm: pmMap[day], am: amMap[day] };
}

        { num:2, key:'retinal-2', notes:'2-3 pumps · pat into skin', optional:true },
        { num:3, key:'retinal-3', notes:'2-3 drops · press gently · PDRN + EGF repair', wait:60, waitLabel:'Wait 60 sec' },
        { num:4, key:'retinal-4', notes:'Rice grain per eye · tap gently' },

      ],

      ],

        { num:3, key:'saturday-3', notes:'2-3 drops · press gently', wait:60, waitLabel:'Wait 60 sec' },
        { num:4, key:'saturday-4', notes:'2-3 drops · press gently · PDRN + EGF repair', wait:60, waitLabel:'Wait 60 sec' },
        { num:5, key:'saturday-5', notes:'Rice grain per eye · tap gently' },

    }
  ],
  am: [
    {
      key:'am-a', label:'Day A — Mon / Wed / Fri / Sun', sub:'Vitamin C', dot:'dot-am-a',
      toners: [

      ],

        { num:1, key:'am-a-1', notes:'Rice grain per eye · pat gently' },

      ]
    },

      key:'am-b', label:'Day B — Tue / Thu / Sat', sub:'Copper peptide', dot:'dot-am-b',

      ],

        { num:2, key:'am-b-2', notes:'3-4 drops · press into skin · copper peptides + PDRN' },

      ]

};

function getTags(name) {
  const n = name.toLowerCase();
  const tags = [];
  if (n.includes('golden hour') || n.includes('vitamin c')) tags.push('c');
  if (n.includes('ghk') || n.includes('copper')) tags.push('ghk');
  if (n.includes('egf') && !n.includes('rejuran')) tags.push('egf');
  if (n.includes('rejuran') || n.includes('dual')) tags.push('rej');
  if ((n.includes('pdrn') || n.includes('rejuvenating')) && (n.includes('cream') || n.includes('max'))) tags.push('pdrn');
  if (n.includes('spf') || n.includes('aquafresh') || n.includes('tatch') || n.includes('milky')) tags.push('spf');
  return tags;
}

function tagHTML(name) {
  return getTags(name).map(t => {
    if (t==='c')    return '<span class="tag tag-c">Vitamin C</span>';
    if (t==='ghk')  return '<span class="tag tag-ghk">GHK-Cu</span>';
    if (t==='egf')  return '<span class="tag tag-egf">EGF</span>';
    if (t==='rej')  return '<span class="tag tag-rej">Rejuran</span>';
    if (t==='pdrn') return '<span class="tag tag-pdrn">PDRN</span>';
    if (t==='spf')  return '<span class="tag tag-spf">SPF</span>';
    return '';
  }).join('');
}

function renderRoutine(products) {
  const today = getTodayCard();
  ['pm','am'].forEach(panel => {
    document.getElementById(panel).innerHTML = ROUTINE[panel].map(day => {
      const isToday = today[panel] === day.key;
      const todayLabel = isToday ? (panel==='am' ? '<span class="today-pill">Today</span>' : '<span class="today-pill">Tonight</span>') : '';

      const tonerNote = day.tonerNote ? `<span class="toner-note">↑ ${day.tonerNote}</span>` : '';
      const tonerRows = day.toners.map((t,i) => {
        const warn = t.warn ? `<span class="toner-warn-${t.warn}">${t.warn==='skip'?'⚠':'✓'} ${t.warnText}</span>` : '';
        return `<div class="toner-row">${i===0?'<span style="width:14px;display:inline-block"></span>':'<span class="toner-arrow">→</span>'}<span>${t.name}</span>${warn}</div>`;
      }).join('');

      const stepRows = day.steps.filter(s => !s.toner).map(s => {
        const name = products[s.key] || s.key;
        const waitBtn = s.waitBtn || 'Start';
        const timerId = `timer-${s.key}`;
        const waitRow = s.wait ? `<div class="wait-row"><span class="wait-label">⏱ ${s.waitLabel}</span><button class="timer-btn" id="${timerId}" onclick="startTimer(this,${s.wait},'${waitBtn}','${s.key}')">▶ ${waitBtn}</button></div>` : '';
        return `<div class="step${s.optional?' optional':''}">
          <div class="step-num">${s.num}</div>
          <div class="step-info">
            <div class="step-product">${name}${tagHTML(name)}</div>
            ${s.notes?`<div class="step-meta">${s.notes}</div>`:''}
            ${waitRow}
          </div>
        </div>`;
      }).join('');

      return `<div class="day-card${isToday?' open today-card':''}" id="card-${day.key}">
        <div class="day-header" onclick="toggle('card-${day.key}')">
          <div class="day-dot ${day.dot}"></div>
          <div class="day-name">${day.label}${todayLabel}</div>
          <div class="day-sub">${day.sub}</div>
          <div class="chevron">▼</div>
        </div>
        <div class="day-body">
          <div class="toner-block"><div class="toner-label">Toners ${tonerNote}</div>${tonerRows}</div>
          <div class="steps">${stepRows}</div>
        </div>
      </div>`;
    }).join('');
  });
  restoreTimers();
}

function updateSyncBadge(live) {
  const badge = document.getElementById('sync-badge');
  const timeStr = localStorage.getItem(CACHE_TIME_KEY);
  if (!timeStr) { badge.style.display='none'; return; }
  const mins = Math.round((Date.now() - parseInt(timeStr)) / 60000);
  const label = mins < 1 ? 'Synced just now' : mins < 60 ? `Synced ${mins}m ago` : 'Synced ' + new Date(parseInt(timeStr)).toLocaleDateString();
  badge.textContent = label;
  badge.className = 'sync-badge' + (live ? '' : ' stale');
  badge.style.display = 'block';
}

async function loadRoutine() {
  const cached = localStorage.getItem(CACHE_KEY);
  if (cached) {
    try { renderRoutine(JSON.parse(cached)); document.getElementById('status').textContent='Skincare Routine'; updateSyncBadge(false); } catch(e) {}
  }
  try {
    const res = await fetch(SCRIPT_URL);
    if (!res.ok) throw new Error('failed');
    const rows = await res.json();
    const products = {};
    rows.forEach(r => {
      const key = String(r.Day||'').trim().toLowerCase();
      const name = String(r.Product||'').trim();
      if (key && name) products[key] = name;
    });
    localStorage.setItem(CACHE_KEY, JSON.stringify(products));
    localStorage.setItem(CACHE_TIME_KEY, Date.now().toString());
    renderRoutine(products);
    document.getElementById('status').textContent = 'Skincare Routine';
    updateSyncBadge(true);
  } catch(e) {
    if (!cached) { renderRoutine({}); document.getElementById('status').textContent='Showing saved routine'; }
  }
}

function saveTimerState(key, endTime, done) {
  const timers = JSON.parse(localStorage.getItem(TIMER_KEY)||'{}');
  if (done) { delete timers[key]; } else { timers[key] = endTime; }
  localStorage.setItem(TIMER_KEY, JSON.stringify(timers));
}

function restoreTimers() {
  const timers = JSON.parse(localStorage.getItem(TIMER_KEY)||'{}');
  Object.entries(timers).forEach(([key, endTime]) => {
    const remaining = Math.round((endTime - Date.now()) / 1000);
    const btn = document.getElementById(`timer-${key}`);
    if (!btn) return;
    if (remaining <= 0) { btn.classList.add('done'); btn.textContent='✓ Done'; saveTimerState(key,0,true); }
    else { runTimer(btn, remaining, endTime, btn.textContent.replace('▶ ',''), key); }
  });
}

let wakeLock = null;
async function requestWakeLock() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
}
function releaseWakeLock() { if (wakeLock) { wakeLock.release(); wakeLock = null; } }
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState==='visible') {
    const timers = JSON.parse(localStorage.getItem(TIMER_KEY)||'{}');
    if (Object.keys(timers).length > 0) await requestWakeLock();
  }
});

let audioCtx = null;
function getAudioCtx() { if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function playDone() {
  try {
    const ctx = getAudioCtx();
    const play = () => { [{freq:880,start:0,dur:.15},{freq:1046,start:.18,dur:.15},{freq:1318,start:.36,dur:.28}].forEach(b => { const osc=ctx.createOscillator(),gain=ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.type='sine'; osc.frequency.value=b.freq; gain.gain.setValueAtTime(0,ctx.currentTime+b.start); gain.gain.linearRampToValueAtTime(0.5,ctx.currentTime+b.start+.02); gain.gain.linearRampToValueAtTime(0,ctx.currentTime+b.start+b.dur); osc.start(ctx.currentTime+b.start); osc.stop(ctx.currentTime+b.start+b.dur+.05); }); };
    ctx.state==='suspended' ? ctx.resume().then(play) : play();
  } catch(e) {}
}

function startTimer(btn, seconds, btnLabel, key) {
  const ctx = getAudioCtx(); if (ctx.state==='suspended') ctx.resume();
  if (btn.classList.contains('done')) { btn.classList.remove('done'); btn.textContent='▶ '+btnLabel; saveTimerState(key,0,true); return; }
  if (btn.classList.contains('running')) return;
  requestWakeLock();
  const endTime = Date.now() + (seconds*1000);
  saveTimerState(key, endTime, false);
  runTimer(btn, seconds, endTime, btnLabel, key);
}

function runTimer(btn, initialRemaining, endTime, btnLabel, key) {
  btn.classList.add('running');
  function tick() {
    const remaining = Math.round((endTime - Date.now()) / 1000);
    if (remaining <= 0) {
      btn.classList.remove('running'); btn.classList.add('done'); btn.textContent='✓ Done';
      playDone(); if (navigator.vibrate) navigator.vibrate([200,100,200]);
      saveTimerState(key,0,true);
      const timers = JSON.parse(localStorage.getItem(TIMER_KEY)||'{}');
      if (Object.keys(timers).length===0) releaseWakeLock();
      return;
    }
    const m=Math.floor(remaining/60), s=remaining%60;
    btn.textContent = m>0 ? `${m}:${s.toString().padStart(2,'0')}` : `${s}s`;
    setTimeout(tick, 500);
  }
  tick();
}

function toggle(id) { document.getElementById(id).classList.toggle('open'); }
function show(id, e) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  e.target.classList.add('active');
}

loadRoutine();
</script>
